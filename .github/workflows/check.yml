name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Python configuration tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Compile Python syntax
        run: python3 -m compileall -q port scripts tests
      - name: Check shell syntax
        run: find port scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
